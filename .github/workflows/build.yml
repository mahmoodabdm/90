name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fix Wrapper
        run: |
          rm -f local.properties gradle-wrapper.jar
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Build AAB
        run: |
         ./gradlew bundleDebug --no-daemon
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/debug/*.aab
